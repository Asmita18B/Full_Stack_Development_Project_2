<div class="form">
  <input [(ngModel)]="description" placeholder="Description" />
  <input type="number" [(ngModel)]="amount" placeholder="Amount" />

  <select [(ngModel)]="paidBy">
    <option value="" disabled>Paid by</option>
    @for (m of members(); track m) {
      <option [value]="m">{{ m }}</option>
    }
  </select>

  <select [(ngModel)]="group">
    <option value="" disabled>Group</option>
    @for (g of groups(); track g) {
      <option [value]="g">{{ g }}</option>
    }
  </select>

  <button (click)="submit()">Add Expense</button>
</div>
